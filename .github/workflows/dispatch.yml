name: Dispatch & keep-alive

# One call does both jobs (PRD Section 14): it touches the database — clearing Supabase Free's
# ~7-day inactivity pause (risk R-1) — and it enqueues due reminders and retries pending webhook
# deliveries (NFR-17). Scheduled workflows can run late; deliveries are also attempted inline
# right after booking and cancellation.
#
# Until the app is deployed and the APP_URL / DISPATCH_TOKEN repository secrets are set, every
# step is skipped, so the schedule never produces a failing run.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
    steps:
      - name: Not configured yet
        if: env.APP_URL == '' || env.DISPATCH_TOKEN == ''
        run: echo "APP_URL and DISPATCH_TOKEN secrets are not set - skipping."
      - name: Health
        if: env.APP_URL != '' && env.DISPATCH_TOKEN != ''
        run: curl --fail --silent --show-error "$APP_URL/api/v1/health"
      - name: Dispatch
        if: env.APP_URL != '' && env.DISPATCH_TOKEN != ''
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-Correlation-Id: gha-${{ github.run_id }}" \
            "$APP_URL/api/v1/internal/events/dispatch"
